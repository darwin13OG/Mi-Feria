<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgPremium" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#110e08"/>
      <stop offset="70%" stop-color="#080604"/>
      <stop offset="100%" stop-color="#030201"/>
    </radialGradient>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowCyanRim" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgPremium)" stroke="#b45309" stroke-width="3"/>
  <!-- Inner Rim Double Line Gold -->
  <rect x="26" y="26" width="460" height="460" rx="102" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>

  <g transform="translate(0, 15)">
    <!-- 3 Golden Dots on Top -->
    <circle cx="236" cy="136" r="5" fill="#d97706" />
    <circle cx="256" cy="124" r="8.5" fill="#fbbf24" />
    <circle cx="276" cy="136" r="5" fill="#d97706" />

    <!-- Suspension strings / roof wires -->
    <line x1="256" y1="145" x2="195" y2="225" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
    <line x1="256" y1="145" x2="317" y2="225" stroke="#78350f" stroke-width="3" stroke-linecap="round" />

    <!-- Gold Canopy / Arch Roof with Amber Glow -->
    <path d="M 140,230 C 140,150 372,150 372,230" fill="none" stroke="#f59e0b" stroke-width="17" stroke-linecap="round" filter="url(#glowGold)" />

    <!-- Golden Stand Structure U-shape -->
    <path d="M 170,225 L 170,325 C 170,375 342,375 342,325 L 342,225" fill="none" stroke="#f59e0b" stroke-width="9" stroke-linecap="round" />

    <!-- Central Medallion with Glowing Cyan Outer Ring -->
    <circle cx="256" cy="298" r="54" fill="#03050a" stroke="#00b4d8" stroke-width="10" filter="url(#glowCyanRim)" />

    <!-- 4-Pointed Golden Star in Center -->
    <path d="M 256,266 Q 256,298 288,298 Q 256,298 256,330 Q 256,298 224,298 Q 256,298 256,266 Z" fill="#f59e0b" stroke="#fbbf24" stroke-width="1.5" />
    <!-- Cyan Center Dot in the Star -->
    <circle cx="256" cy="298" r="5.5" fill="#00e5ff" />
  </g>
</svg>