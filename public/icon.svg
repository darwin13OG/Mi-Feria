<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#090d1a"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>

    <!-- Calculator Body Gradient -->
    <linearGradient id="calcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Calculator Border Neon -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Screen Glow & Surface -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Gold Coin 3D Gradients -->
    <radialGradient id="coinFace" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="90%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </radialGradient>

    <linearGradient id="coinRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Keypad Button Gradients -->
    <linearGradient id="btnBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="btnEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="btnAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="btnDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadow3D" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="coinGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#fbbf24" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Rounded Container Base -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="120" fill="none" stroke="url(#neonBorder)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Ambient Light Backdrops -->
  <circle cx="190" cy="250" r="140" fill="#0284c7" opacity="0.18" filter="blur(40px)"/>
  <circle cx="370" cy="270" r="120" fill="#f59e0b" opacity="0.24" filter="blur(40px)"/>

  <!-- ================= CALCULATOR (Left Center) ================= -->
  <g filter="url(#shadow3D)">
    <!-- Main Calculator Shell -->
    <rect x="66" y="58" width="280" height="396" rx="44" fill="url(#calcGrad)" stroke="url(#neonBorder)" stroke-width="6"/>

    <!-- Subtle Inner Bevel / Reflection -->
    <rect x="72" y="64" width="268" height="384" rx="40" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12"/>
    <line x1="110" y1="65" x2="302" y2="65" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>

    <!-- Digital Display Screen Area -->
    <rect x="94" y="92" width="224" height="88" rx="20" fill="url(#screenGrad)" stroke="#10b981" stroke-width="3.5"/>
    
    <!-- Screen Glass Shine Effect -->
    <path d="M 96 112 Q 206 100 316 118 L 316 94 Q 206 90 96 94 Z" fill="#ffffff" opacity="0.08"/>

    <!-- Screen Text: Digital Balance Amount -->
    <text x="302" y="152" fill="#34d399" font-family="'Courier New', Courier, monospace, system-ui" font-size="34" font-weight="900" text-anchor="end" letter-spacing="2">
      $95.000
    </text>
    <text x="108" y="122" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1">
      STAND OK
    </text>
    <circle cx="298" cy="116" r="4" fill="#34d399"/>

    <!-- KEYPAD BUTTONS (Rows with Operators and Numbers) -->
    <!-- Row 1: Function / Operators -->
    <rect x="98" y="202" width="48" height="42" rx="12" fill="url(#btnEmerald)" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="122" y="229" fill="#022c22" font-family="system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="middle">AC</text>

    <rect x="156" y="202" width="48" height="42" rx="12" fill="url(#btnBlue)" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="180" y="229" fill="#082f49" font-family="system-ui, sans-serif" font-size="22" font-weight="900" text-anchor="middle">÷</text>

    <rect x="214" y="202" width="48" height="42" rx="12" fill="url(#btnBlue)" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="238" y="229" fill="#082f49" font-family="system-ui, sans-serif" font-size="22" font-weight="900" text-anchor="middle">×</text>

    <rect x="272" y="202" width="48" height="42" rx="12" fill="url(#btnAmber)" stroke="#fde047" stroke-width="1.5"/>
    <text x="296" y="229" fill="#451a03" font-family="system-ui, sans-serif" font-size="22" font-weight="900" text-anchor="middle">−</text>

    <!-- Row 2: Numbers 7, 8, 9, + -->
    <rect x="98" y="258" width="48" height="42" rx="12" fill="url(#btnDark)" stroke="#475569" stroke-width="1.5"/>
    <text x="122" y="285" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">7</text>

    <rect x="156" y="258" width="48" height="42" rx="12" fill="url(#btnDark)" stroke="#475569" stroke-width="1.5"/>
    <text x="180" y="285" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">8</text>

    <rect x="214" y="258" width="48" height="42" rx="12" fill="url(#btnDark)" stroke="#475569" stroke-width="1.5"/>
    <text x="238" y="285" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">9</text>

    <rect x="272" y="258" width="48" height="98" rx="14" fill="url(#btnBlue)" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="296" y="314" fill="#082f49" font-family="system-ui, sans-serif" font-size="26" font-weight="900" text-anchor="middle">+</text>

    <!-- Row 3: Numbers 4, 5, 6 -->
    <rect x="98" y="314" width="48" height="42" rx="12" fill="url(#btnDark)" stroke="#475569" stroke-width="1.5"/>
    <text x="122" y="341" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">4</text>

    <rect x="156" y="314" width="48" height="42" rx="12" fill="url(#btnDark)" stroke="#475569" stroke-width="1.5"/>
    <text x="180" y="341" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">5</text>

    <rect x="214" y="314" width="48" height="42" rx="12" fill="url(#btnDark)" stroke="#475569" stroke-width="1.5"/>
    <text x="238" y="341" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">6</text>

    <!-- Row 4: Numbers 1, 2, 3, = -->
    <rect x="98" y="370" width="48" height="42" rx="12" fill="url(#btnDark)" stroke="#475569" stroke-width="1.5"/>
    <text x="122" y="397" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">1</text>

    <rect x="156" y="370" width="48" height="42" rx="12" fill="url(#btnDark)" stroke="#475569" stroke-width="1.5"/>
    <text x="180" y="397" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">2</text>

    <rect x="214" y="370" width="48" height="42" rx="12" fill="url(#btnDark)" stroke="#475569" stroke-width="1.5"/>
    <text x="238" y="397" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">3</text>

    <rect x="272" y="370" width="48" height="42" rx="12" fill="url(#btnEmerald)" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="296" y="397" fill="#022c22" font-family="system-ui, sans-serif" font-size="24" font-weight="900" text-anchor="middle">=</text>
  </g>

  <!-- ================= GOLDEN COIN (Right Side, Leaning & Overlapping) ================= -->
  <g filter="url(#coinGlow)">
    <!-- 3D Outer Edge / Thickness Offset -->
    <ellipse cx="388" cy="276" rx="98" ry="98" fill="#78350f"/>
    <ellipse cx="384" cy="270" rx="98" ry="98" fill="url(#coinRimGrad)"/>

    <!-- Main Coin Face -->
    <circle cx="382" cy="264" r="92" fill="url(#coinFace)" stroke="#fef08a" stroke-width="4"/>

    <!-- Inner Concentric Beaded / Star Ring -->
    <circle cx="382" cy="264" r="76" fill="none" stroke="#ca8a04" stroke-width="3.5" stroke-dasharray="8 6"/>
    <circle cx="382" cy="264" r="82" fill="none" stroke="#fef9c3" stroke-width="1.5" opacity="0.6"/>

    <!-- Embossed Giant Currency Symbol ($) -->
    <!-- Vertical Bars -->
    <line x1="382" y1="202" x2="382" y2="326" stroke="#78350f" stroke-width="18" stroke-linecap="round"/>
    <line x1="382" y1="202" x2="382" y2="326" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>

    <!-- S-Curve Shadow for 3D depth -->
    <path d="M 416 230 C 416 210 402 204 382 204 C 358 204 346 216 346 234 C 346 260 416 256 416 288 C 416 312 398 324 382 324 C 358 324 344 310 344 290"
          fill="none"
          stroke="#78350f"
          stroke-width="22"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- S-Curve Bright Top Stroke -->
    <path d="M 416 230 C 416 210 402 204 382 204 C 358 204 346 216 346 234 C 346 260 416 256 416 288 C 416 312 398 324 382 324 C 358 324 344 310 344 290"
          fill="none"
          stroke="#ffffff"
          stroke-width="14"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Specular Star Sparkles on the Gold Coin -->
    <path d="M 340 210 Q 344 200 354 198 Q 344 196 340 186 Q 336 196 326 198 Q 336 200 340 210 Z" fill="#ffffff"/>
    <circle cx="340" cy="198" r="8" fill="#ffffff" opacity="0.4" filter="blur(2px)"/>
    
    <path d="M 436 304 Q 439 296 447 294 Q 439 292 436 284 Q 433 292 425 294 Q 433 296 436 304 Z" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
