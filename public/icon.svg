<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Calculator Body Gradient -->
    <linearGradient id="calcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Screen Glass Gradient -->
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Golden Coin Radial -->
    <radialGradient id="goldRadial" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softDrop" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas App Icon Base Frame -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.25"/>

  <!-- Subtle glow spots behind items -->
  <circle cx="200" cy="240" r="130" fill="#0284c7" opacity="0.12"/>
  <circle cx="360" cy="280" r="100" fill="#f59e0b" opacity="0.16"/>

  <!-- ================= MINIMALIST CALCULATOR (Left/Center) ================= -->
  <g filter="url(#softDrop)">
    <!-- Calculator Body -->
    <rect x="74" y="70" width="260" height="372" rx="36" fill="url(#calcGrad)" stroke="#38bdf8" stroke-width="4"/>

    <!-- Screen Window (Clean Minimalist Display) -->
    <rect x="98" y="98" width="212" height="74" rx="16" fill="url(#screenGlass)" stroke="#10b981" stroke-width="2.5"/>
    
    <!-- Screen Value (Clean Bold Display, Highly Visible) -->
    <text x="290" y="150" fill="#34d399" font-family="system-ui, -apple-system, BlinkMacSystemFont, monospace" font-size="34" font-weight="900" text-anchor="end" letter-spacing="2">
      $ 0.00
    </text>

    <!-- KEYPAD MATRIX: 4 Rows x 3 Columns (Minimalist, Bold, Scalable) -->
    <!-- Row 1: Clear (Orange), Divide (Amber), Multiply (Amber) -->
    <rect x="100" y="196" width="56" height="48" rx="14" fill="#ea580c"/>
    <text x="128" y="228" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="middle">C</text>

    <rect x="176" y="196" width="56" height="48" rx="14" fill="#f59e0b"/>
    <text x="204" y="228" fill="#451a03" font-family="system-ui, sans-serif" font-size="24" font-weight="900" text-anchor="middle">÷</text>

    <rect x="252" y="196" width="56" height="48" rx="14" fill="#f59e0b"/>
    <text x="280" y="228" fill="#451a03" font-family="system-ui, sans-serif" font-size="24" font-weight="900" text-anchor="middle">×</text>

    <!-- Row 2: 7, 8, Minus (Amber) -->
    <rect x="100" y="258" width="56" height="48" rx="14" fill="#334155"/>
    <text x="128" y="290" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">7</text>

    <rect x="176" y="258" width="56" height="48" rx="14" fill="#334155"/>
    <text x="204" y="290" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">8</text>

    <rect x="252" y="258" width="56" height="48" rx="14" fill="#f59e0b"/>
    <text x="280" y="290" fill="#451a03" font-family="system-ui, sans-serif" font-size="26" font-weight="900" text-anchor="middle">−</text>

    <!-- Row 3: 4, 5, Plus (Amber) -->
    <rect x="100" y="320" width="56" height="48" rx="14" fill="#334155"/>
    <text x="128" y="352" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">4</text>

    <rect x="176" y="320" width="56" height="48" rx="14" fill="#334155"/>
    <text x="204" y="352" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">5</text>

    <rect x="252" y="320" width="56" height="48" rx="14" fill="#f59e0b"/>
    <text x="280" y="352" fill="#451a03" font-family="system-ui, sans-serif" font-size="24" font-weight="900" text-anchor="middle">+</text>

    <!-- Row 4: 1, 2, Equals (Emerald Action Key) -->
    <rect x="100" y="382" width="56" height="48" rx="14" fill="#334155"/>
    <text x="128" y="414" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">1</text>

    <rect x="176" y="382" width="56" height="48" rx="14" fill="#334155"/>
    <text x="204" y="414" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">2</text>

    <rect x="252" y="382" width="56" height="48" rx="14" fill="#10b981"/>
    <text x="280" y="414" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="900" text-anchor="middle">=</text>
  </g>

  <!-- ================= MINIMALIST GOLDEN COIN (Right Side) ================= -->
  <g filter="url(#softDrop)">
    <!-- Outer Edge Depth -->
    <circle cx="376" cy="276" r="92" fill="#78350f"/>
    <!-- Coin Face -->
    <circle cx="372" cy="270" r="90" fill="url(#goldRadial)" stroke="#fef08a" stroke-width="4"/>

    <!-- Inner Groove Ring -->
    <circle cx="372" cy="270" r="74" fill="none" stroke="#ca8a04" stroke-width="3" stroke-dasharray="8 6"/>

    <!-- Embossed Dollar Sign ($) -->
    <!-- Vertical Bars -->
    <line x1="372" y1="210" x2="372" y2="330" stroke="#78350f" stroke-width="14" stroke-linecap="round"/>
    <line x1="372" y1="210" x2="372" y2="330" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

    <!-- S Curve Outline Shadow -->
    <path d="M 398 238 C 398 222 386 216 372 216 C 352 216 342 226 342 242 C 342 264 398 260 398 288 C 398 308 384 318 372 318 C 352 318 340 306 340 290"
          fill="none"
          stroke="#78350f"
          stroke-width="18"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- S Curve White Clean Core -->
    <path d="M 398 238 C 398 222 386 216 372 216 C 352 216 342 226 342 242 C 342 264 398 260 398 288 C 398 308 384 318 372 318 C 352 318 340 306 340 290"
          fill="none"
          stroke="#ffffff"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
