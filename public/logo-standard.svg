<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgStandard" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0a121e"/>
      <stop offset="70%" stop-color="#05080e"/>
      <stop offset="100%" stop-color="#020407"/>
    </radialGradient>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowGreenArrow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgStandard)" stroke="#0f2238" stroke-width="4"/>
  <!-- Inner Rim Outline -->
  <rect x="26" y="26" width="460" height="460" rx="102" fill="none" stroke="#061526" stroke-width="2"/>

  <!-- Tent / Stand Outline -->
  <g transform="translate(0, 20)">
    <!-- Arch / Roof -->
    <path d="M 140,240 C 140,160 372,160 372,240" fill="none" stroke="#00b4d8" stroke-width="16" stroke-linecap="round" filter="url(#glowCyan)" />
    
    <!-- Top Dot on Arch -->
    <circle cx="256" cy="172" r="8" fill="#38bdf8" />

    <!-- Lower Stall Structure U-shape -->
    <path d="M 168,235 L 168,310 C 168,365 344,365 344,310 L 344,235" fill="none" stroke="#0b233a" stroke-width="14" stroke-linecap="round" />

    <!-- Central Medallion -->
    <circle cx="256" cy="300" r="52" fill="#040812" stroke="#00b4d8" stroke-width="9" filter="url(#glowCyan)" />

    <!-- Rising Green Arrow -->
    <g transform="translate(256, 300)">
      <path d="M -24,16 L -10,3 L 6,10 L 22,-14" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowGreenArrow)" />
      <!-- Arrowhead -->
      <path d="M 9,-16 L 24,-16 L 24,-1" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>